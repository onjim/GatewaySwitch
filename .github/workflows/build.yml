name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build GatewaySwitch.csproj -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GatewaySwitch-windows
          path: bin/Release/net48/GatewaySwitch.exe

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $path = "docs/releases/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $path) { "path=$path" >> $env:GITHUB_OUTPUT }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net48/GatewaySwitch.exe
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: true
